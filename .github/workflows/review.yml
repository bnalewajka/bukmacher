# Weekly self-review on Opus: read the ledger, the lessons and the week's reports, change the
# skill where the evidence supports it (guard-rails in references/self-review.md), log the
# changes in data/changelog.md. Tests must pass or nothing is committed.
name: review

on:
  schedule:
    - cron: "23 6 * * 0"   # Sunday 08:23 CEST / 07:23 CET
  workflow_dispatch:
    inputs:
      model:
        description: "Claude model"
        required: false
        default: "claude-opus-5-5"

permissions:
  contents: write

concurrency:
  group: bukmacher-main
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      BUKMACHER_CLOUD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code && pip install --quiet pytest

      - name: review
        shell: bash
        run: |
          claude -p "Przeprowadź cotygodniowy przegląd skilla bukmacher dokładnie według .claude/skills/bukmacher/references/self-review.md. Nie commituj — zrobi to workflow." \
            --model "${{ inputs.model || 'claude-opus-5-5' }}" \
            --dangerously-skip-permissions \
            --max-turns 200 \
            --output-format stream-json --verbose \
            | tee claude-review.jsonl \
            | jq -r --unbuffered -f .github/claude-log.jq

      - name: tests
        run: python3 -m pytest -q tests

      - name: commit
        run: |
          git config user.name "bukmacher-bot"
          git config user.email "bukmacher-bot@users.noreply.github.com"
          git add .claude/skills/bukmacher data tests
          git diff --cached --quiet && exit 0
          git commit -m "review: weekly self-review $(date -u +%F)"
          git pull --rebase --quiet && git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-review-log
          path: claude-review.jsonl
          retention-days: 30

  publish:
    needs: review
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      pages: write
      id-token: write
