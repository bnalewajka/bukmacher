# Nightly settlement without Claude: grade finished bets from ESPN / The Odds API, commit the
# ledger, republish the site. Cheap (a few Odds API credits at most), so it also runs whenever
# a report run was skipped.
name: settle

on:
  schedule:
    - cron: "30 2 * * *"   # 04:30 CEST / 03:30 CET
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bukmacher-main
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: settle and score
        working-directory: .claude/skills/bukmacher
        run: |
          python3 scripts/ledger.py settle
          python3 scripts/ledger.py stats
      - name: commit
        run: |
          git config user.name "bukmacher-bot"
          git config user.email "bukmacher-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "ledger: nightly settlement $(date -u +%F)"
          git pull --rebase --quiet && git push

  publish:
    needs: settle
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      pages: write
      id-token: write
